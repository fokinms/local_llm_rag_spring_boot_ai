services:

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11431:11434"
    volumes:
      - ./ollama:/root/.ollama
    entrypoint: >
      /bin/sh -c "
      ollama serve &
      sleep 2 &&
      ollama pull gemma3:4b-it-q4_K_M &&
      ollama pull mxbai-embed-large &&
      wait
      "
    restart: unless-stopped

  postgresql:
    image: ankane/pgvector:v0.5.0
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ragdb
      PGPASSWORD: postgres
    logging:
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "5432:5432"
    volumes:
      - ./postgresql_data:/var/lib/postgresql/data
      - ./postgres/scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: "pg_isready -U postgres -d ragdb"
      interval: 2s
      timeout: 20s
      start_period: 10s
      retries: 10
    labels:
      amplicode.image: postgres
